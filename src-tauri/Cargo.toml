[package]
name = "stashdock"
version = "1.0.1"
description = "A local-first context dock for AI coding agents"
authors = ["StashDock contributors"]
edition = "2021"
default-run = "stashdock"
license = "MIT"
repository = "https://github.com/StashDock/StashDock"

[[bin]]
name = "stashdock-preview"
path = "src/bin/preview-helper.rs"

[[bin]]
name = "stashdock-browser"
path = "src/bin/browser-host.rs"

[[bin]]
name = "stashdock-storage"
path = "src/bin/storage-helper.rs"

[lib]
name = "stashdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
plist = "=1.10.1"
rusqlite = { version = "0.40.0", features = ["bundled", "backup"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
brotli = { version = "9", default-features = false, features = ["std"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
resvg = { version = "0.45", default-features = false }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.2"
sha2 = "0.10"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
time = { version = "0.3", features = ["formatting"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
resvg = { version = "0.45", default-features = false }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent"] }
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSApplication", "NSEvent", "NSImage", "NSView", "NSWindow", "NSResponder", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSAccessibilityProtocols", "NSAccessibility", "NSTrackingArea", "NSGraphicsContext", "NSImageRep", "objc2-quartz-core", "NSWorkspace", "NSRunningApplication", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSData", "NSGeometry", "NSObject", "NSValue", "NSLocale", "NSOperation", "NSError", "NSBundle"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CABase", "CALayer", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "CATransaction", "CATransform3D", "objc2-core-foundation"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# One TLS stack per platform: Windows uses the system's (native-tls, SChannel).
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json", "socks"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-webview = { package = "windows", version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json"] }
windows = { version = "0.52", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }
